<div class="recipe-sidebar recipe-sidebar__card--share">
    <h3 class="recipe-sidebar__title">
        <i data-lucide="share-2"></i>
        Compartilhar
    </h3>

    <div class="recipe-share">
        <button
            class="recipe-share__btn recipe-share__btn--whatsapp"
            aria-label="Compartilhar no WhatsApp"
        >
            <i data-lucide="message-circle"></i>
            WhatsApp
        </button>

        <button
            class="recipe-share__btn recipe-share__btn--instagram"
            aria-label="Compartilhar no Instagram"
        >
            <i data-lucide="instagram"></i>
            Instagram
        </button>

        <button
            class="recipe-share__btn recipe-share__btn--copy"
            aria-label="Copiar link da receita"
        >
            <i data-lucide="link"></i>
            Copiar link
        </button>
    </div>
</div>
