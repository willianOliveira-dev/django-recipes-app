<section class="recipe-actions">
    <button class="recipe-actions__btn" onclick="window.print()">
        <i data-lucide="printer"></i>
        <span>Imprimir</span>
    </button>

    <button class="recipe-actions__btn" id="copyRecipe">
        <i data-lucide="copy"></i>
        <span>Copiar</span>
    </button>

    <button class="recipe-actions__btn recipe-actions__btn--save">
        <i data-lucide="heart"></i>
        <span>Favoritar</span>
    </button>
</section>
